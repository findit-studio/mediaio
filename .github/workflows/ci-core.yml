name: CI / core

# The pure-Rust crates: the vocabulary (`mediaspine`), the read faces
# (`mediadecode`), the write faces (`mediaencode`), the umbrella at its
# FFmpeg-free default (`mediaio`), and the timeline (`mediaio-timeline`,
# the `timeline*` jobs). Triggered by changes to any of them, to shared
# workspace files, or to this workflow. The adapter workflows
# (`ci-ffmpeg.yml`, `ci-webcodecs.yml`) carry the faces in their own
# triggers, so a change to a face fans out to the adapters too.
on:
  push:
    branches: [main]
    paths:
      - 'mediaspine/**'
      - 'mediadecode/**'
      - 'mediaencode/**'
      - 'mediaio/**'
      - 'mediaio-timeline/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'ci/**'
      - '.github/workflows/ci-core.yml'
  pull_request:
    paths:
      - 'mediaspine/**'
      - 'mediadecode/**'
      - 'mediaencode/**'
      - 'mediaio/**'
      - 'mediaio-timeline/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'ci/**'
      - '.github/workflows/ci-core.yml'
  workflow_dispatch:
  schedule: 
    - cron: "0 1 1 * *"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  RUST_BACKTRACE: 1

jobs:
  rustfmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install Rust
      run: rustup update stable && rustup default stable && rustup component add rustfmt
    - name: Check formatting
      run: cargo fmt -p mediaspine -p mediadecode -p mediaencode -p mediaio -- --check

  clippy:
    name: clippy
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - name: Install Rust
      run: rustup update stable --no-self-update && rustup default stable && rustup component add clippy
    - name: Install cargo-hack
      run: cargo install cargo-hack
    - name: Apply clippy lints
      run: cargo hack clippy -p mediaspine -p mediadecode -p mediaencode --each-feature --exclude-no-default-features
    # The umbrella's `ffmpeg` feature links FFmpeg; `ci-ffmpeg.yml` lints it.
    - name: Apply clippy lints to the umbrella
      run: cargo hack clippy -p mediaio --each-feature --exclude-no-default-features --exclude-features ffmpeg

  cross:
    name: cross
    strategy:
      matrix:
        target:
          - aarch64-unknown-linux-gnu
          - aarch64-linux-android
          - aarch64-unknown-linux-musl
          - i686-linux-android
          - x86_64-linux-android
          - i686-pc-windows-gnu
          - x86_64-pc-windows-gnu
          - i686-unknown-linux-gnu
          - powerpc64-unknown-linux-gnu
          - riscv64gc-unknown-linux-gnu
          - wasm32-unknown-unknown
          - wasm32-unknown-emscripten
          - wasm32-wasip1
          - wasm32-wasip1-threads
          - wasm32-wasip2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-core-cross-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-core-cross-
      - name: Install Rust
        run: rustup update stable && rustup default stable
      - name: cargo build the pure crates --target ${{ matrix.target }}
        run: |
          rustup target add ${{ matrix.target }}
          cargo build -p mediaspine -p mediadecode -p mediaencode --target ${{ matrix.target }}

  # The core-only and allocating tiers build where there is no operating
  # system at all. `thumbv6m-none-eabi` has no compare-and-swap, so it
  # builds the vocabulary at the core-only tier only.
  no-std:
    name: no-std (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: thumbv7em-none-eabihf, packages: "-p mediaspine -p mediadecode -p mediaencode", alloc: true }
          - { target: thumbv6m-none-eabi, packages: "-p mediaspine", alloc: false }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-core-no-std-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-core-no-std-
      - name: Install Rust
        run: |
          rustup update stable && rustup default stable
          rustup target add ${{ matrix.target }}
      - name: The core-only tier
        run: cargo build ${{ matrix.packages }} --no-default-features --target ${{ matrix.target }}
      - name: The allocating tier
        if: matrix.alloc
        run: cargo build ${{ matrix.packages }} --no-default-features --features alloc --target ${{ matrix.target }}

  build:
    name: build
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - name: Cache cargo build and registry
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-core-build-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-core-build-
    - name: Install Rust
      run: rustup update stable --no-self-update && rustup default stable
    - name: Install cargo-hack
      run: cargo install cargo-hack
    - name: Run build
      run: |
        cargo hack build -p mediaspine -p mediadecode -p mediaencode --feature-powerset --exclude-no-default-features
        cargo build -p mediaio

  test:
    name: test
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - name: Cache cargo build and registry
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-core-test-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-core-test-
    - name: Install Rust
      run: rustup update stable --no-self-update && rustup default stable
    - name: Install cargo-hack
      run: cargo install cargo-hack
    - name: Run test
      run: cargo hack test -p mediaspine -p mediadecode --feature-powerset --exclude-no-default-features
    # The empty set included: `mediaencode`'s only features are its tiers,
    # so its core-only tier is reached by no other combination.
    - name: Run the write faces' tests, the core-only tier included
      run: cargo hack test -p mediaencode --feature-powerset
    - name: Run the umbrella's tests at its default
      run: cargo test -p mediaio

  sanitizer:
    name: sanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-core-sanitizer-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-core-sanitizer-
      - name: Install Rust
        run: rustup update nightly && rustup default nightly
      - name: Install rust-src
        run: rustup component add rust-src
      - name: ASAN / LSAN / MSAN / TSAN
        run: bash ci/sanitizer.sh

  miri-tb:
    name: miri-tb-${{ matrix.target }}
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu }
          - { os: ubuntu-latest, target: i686-unknown-linux-gnu }
          - { os: ubuntu-latest, target: powerpc64-unknown-linux-gnu }
          - { os: ubuntu-latest, target: s390x-unknown-linux-gnu }
          - { os: ubuntu-latest, target: riscv64gc-unknown-linux-gnu }
          - { os: macos-latest,  target: aarch64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-core-miri-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-core-miri-
      - name: Miri
        run: bash ci/miri_tb.sh "${{ matrix.target }}" mediaspine mediadecode mediaencode

  miri-sb:
    name: miri-sb-${{ matrix.target }}
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu }
          - { os: ubuntu-latest, target: i686-unknown-linux-gnu }
          - { os: ubuntu-latest, target: powerpc64-unknown-linux-gnu }
          - { os: ubuntu-latest, target: s390x-unknown-linux-gnu }
          - { os: ubuntu-latest, target: riscv64gc-unknown-linux-gnu }
          - { os: macos-latest,  target: aarch64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-core-miri-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-core-miri-
      - name: Miri
        run: bash ci/miri_sb.sh "${{ matrix.target }}" mediaspine mediadecode mediaencode

  # `mediaio-timeline`: pure Rust, `no_std` in every tier. Features: `std`
  # (the default), `alloc` and `serde`; on `core` alone it exports only its
  # time words. Its tests are the unit laws, the integration laws (the
  # hand-predicted OTIO goldens and the JSON document among them), the
  # seeded properties and the doc tests. Clippy and the tests run on every
  # combination of the three features, the empty one included (`default`
  # is `std`, so it is not run again on its own).
  timeline:
    name: timeline (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
    - name: Cache cargo build and registry
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-timeline-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-timeline-
    - name: Install Rust
      run: rustup update stable --no-self-update && rustup default stable && rustup component add rustfmt clippy
    - name: Install cargo-hack
      run: cargo install cargo-hack
    - name: Check formatting
      run: cargo fmt -p mediaio-timeline -- --check
    - name: Apply clippy lints
      run: cargo hack clippy -p mediaio-timeline --feature-powerset --exclude-features default --all-targets
    - name: Run tests
      run: cargo hack test -p mediaio-timeline --feature-powerset --exclude-features default
    # The crate's doc is the README with `std` or `alloc`, and a doc of its
    # own on `core` alone.
    - name: Build docs
      env:
        RUSTDOCFLAGS: -Dwarnings
      run: |
        cargo doc -p mediaio-timeline --no-deps --no-default-features
        cargo doc -p mediaio-timeline --no-deps --all-features

  # The `no_std` tiers build where there is no operating system at all
  # (`thumbv7em-none-eabihf`, which has no `std`); every tier builds on the
  # wasm targets, and on a 32-bit and a big-endian one.
  timeline-cross:
    name: timeline-cross (${{ matrix.target }})
    strategy:
      matrix:
        include:
          - { target: thumbv7em-none-eabihf,       std: false }
          - { target: wasm32-unknown-unknown,      std: true }
          - { target: wasm32-wasip1,               std: true }
          - { target: wasm32-wasip2,               std: true }
          - { target: i686-unknown-linux-gnu,      std: true }
          - { target: powerpc64-unknown-linux-gnu, std: true }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-timeline-cross-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-timeline-cross-
      - name: Install Rust
        run: rustup update stable && rustup default stable
      - name: no_std tiers (core alone, alloc, serde, alloc + serde)
        run: |
          rustup target add ${{ matrix.target }}
          cargo build -p mediaio-timeline --target ${{ matrix.target }} --no-default-features
          cargo build -p mediaio-timeline --target ${{ matrix.target }} --no-default-features --features alloc
          cargo build -p mediaio-timeline --target ${{ matrix.target }} --no-default-features --features serde
          cargo build -p mediaio-timeline --target ${{ matrix.target }} --no-default-features --features alloc,serde
      - name: std tiers (std, std + serde)
        if: matrix.std
        run: |
          cargo build -p mediaio-timeline --target ${{ matrix.target }}
          cargo build -p mediaio-timeline --target ${{ matrix.target }} --features serde

  # Each target's verdict stands alone: one lane failing cancels no other.
  # Miri runs the default features with `serde`: every test the crate has
  # (the document laws among them), as when `serde` was always on.
  timeline-miri:
    name: timeline-miri-${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-latest, target: i686-unknown-linux-gnu }
          - { os: ubuntu-latest, target: powerpc64-unknown-linux-gnu }
          - { os: macos-latest,  target: aarch64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-timeline-miri-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-timeline-miri-
      - name: Miri
        run: bash ci/miri_tb.sh "${{ matrix.target }}" --features serde mediaio-timeline

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    needs: [rustfmt, clippy, build, cross, no-std, test, sanitizer]
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup update nightly && rustup default nightly && rustup component add llvm-tools-preview
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2.88.1
        with:
          tool: cargo-llvm-cov@0.9.1
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-core-coverage-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-core-coverage-
      - name: Run cargo-llvm-cov
        # Doctests are covered on nightly, the toolchain this job uses.
        run: cargo llvm-cov -p mediaspine -p mediadecode -p mediaencode --all-features --doctests --lcov --output-path lcov.info
      - name: Upload to codecov.io
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ${{ github.repository }}
          files: lcov.info
          fail_ci_if_error: true
          flags: core
