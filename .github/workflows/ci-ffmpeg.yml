name: CI / ffmpeg

# The FFmpeg crates: the base (`mediaio-ffmpeg`), the read adapter
# (`mediadecode-ffmpeg`), the write adapter (`mediaencode-ffmpeg`), and the
# umbrella's `ffmpeg` feature. Triggered by changes to any of them, to the
# vocabulary and faces they implement, to shared workspace files, or to
# this workflow.
#
# FFmpeg is pinned: there is no versioned Homebrew formula for FFmpeg 9,
# so every job restores (or, on a cache miss, builds) FFmpeg 9.0.1 through
# `.github/actions/ffmpeg`, in one of two variants — `full` (GPL, with the
# codec libraries and the `ffmpeg` program the integration tests' fixtures
# are made with) and `lgpl` (no GPL code). macOS only: the hardware lanes
# need VideoToolbox.
on:
  push:
    branches: [main]
    paths:
      - 'mediaspine/**'
      - 'mediadecode/**'
      - 'mediaencode/**'
      - 'mediaio-ffmpeg/**'
      - 'mediadecode-ffmpeg/**'
      - 'mediaencode-ffmpeg/**'
      - 'mediaio/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'ci/**'
      - '.github/actions/**'
      - '.github/workflows/ci-ffmpeg.yml'
  pull_request:
    paths:
      - 'mediaspine/**'
      - 'mediadecode/**'
      - 'mediaencode/**'
      - 'mediaio-ffmpeg/**'
      - 'mediadecode-ffmpeg/**'
      - 'mediaencode-ffmpeg/**'
      - 'mediaio/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'ci/**'
      - '.github/actions/**'
      - '.github/workflows/ci-ffmpeg.yml'
  workflow_dispatch:
  schedule:
    - cron: "0 1 1 * *"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  RUST_BACKTRACE: 1

jobs:
  rustfmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install Rust
      run: rustup update stable && rustup default stable && rustup component add rustfmt
    - name: Check formatting
      run: cargo fmt -p mediaio-ffmpeg -p mediadecode-ffmpeg -p mediaencode-ffmpeg -p mediaio -- --check

  clippy:
    name: clippy
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v7
    - uses: ./.github/actions/ffmpeg
      with:
        variant: full
    - name: Install Rust
      run: rustup update stable && rustup default stable && rustup component add clippy
    - name: Install cargo-hack
      run: cargo install cargo-hack
    - name: Apply clippy lints
      run: |
        cargo hack clippy -p mediaio-ffmpeg -p mediadecode-ffmpeg -p mediaencode-ffmpeg --each-feature --exclude-no-default-features
        cargo clippy -p mediaio --features ffmpeg

  build:
    name: build
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v7
    - name: Cache cargo build and registry
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-ffmpeg-full-build-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-ffmpeg-full-build-
    - uses: ./.github/actions/ffmpeg
      with:
        variant: full
    - name: Install Rust
      run: rustup update stable && rustup default stable
    - name: Install cargo-hack
      run: cargo install cargo-hack
    - name: Run build
      run: cargo hack build -p mediaio-ffmpeg -p mediadecode-ffmpeg -p mediaencode-ffmpeg --feature-powerset --exclude-no-default-features

  test:
    name: test
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v7
      with:
        # Audio fixtures live at `tests/fixtures/audio/` as a
        # submodule pointing at `findit-studio/audio-fixtures`.
        submodules: recursive
    - name: Cache cargo build and registry
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-ffmpeg-full-test-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-ffmpeg-full-test-
    - uses: ./.github/actions/ffmpeg
      with:
        variant: full
    - name: Install Rust
      run: rustup update stable && rustup default stable
    - name: Install cargo-hack
      run: cargo install cargo-hack
    # `test-support` doubles the powerset and adds nothing a single lane
    # with it does not, so the powerset leaves it out and one lane runs it.
    - name: The base and the read adapter, every feature combination
      run: cargo hack test -p mediaio-ffmpeg -p mediadecode-ffmpeg --feature-powerset --exclude-no-default-features --exclude-features test-support
    - name: The base and the read adapter, with test-support
      run: cargo test -p mediaio-ffmpeg -p mediadecode-ffmpeg --features test-support
    # The write adapter's `gpl` combinations are the GPL lane: against
    # the full build, its GPL encoders are admitted by name. Its
    # `test-support`, as the base's, runs in one lane of its own.
    - name: The write adapter, every feature combination
      run: cargo hack test -p mediaencode-ffmpeg --feature-powerset --exclude-no-default-features --exclude-features test-support
    - name: The write adapter, with test-support
      run: cargo test -p mediaencode-ffmpeg --features test-support
    - name: The umbrella with ffmpeg
      run: cargo test -p mediaio --features ffmpeg

  # The refuse-by-name law against an FFmpeg with no GPL code in it: a GPL
  # encoder is refused by its name without `gpl`, and is missing from the
  # linked libavcodec (`NotLinked`) with it. Unit tests only — the
  # integration tests make their fixtures with GPL encoders.
  lgpl:
    name: lgpl
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v7
    - name: Cache cargo build and registry
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-ffmpeg-lgpl-test-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-ffmpeg-lgpl-test-
    - uses: ./.github/actions/ffmpeg
      with:
        variant: lgpl
    - name: Install Rust
      run: rustup update stable && rustup default stable
    - name: The three crates' unit tests
      run: cargo test -p mediaio-ffmpeg -p mediadecode-ffmpeg -p mediaencode-ffmpeg --lib
    - name: The write adapter with gpl
      run: cargo test -p mediaencode-ffmpeg --lib --features gpl
    - name: The umbrella with ffmpeg
      run: cargo test -p mediaio --features ffmpeg

  coverage:
    name: coverage
    runs-on: macos-latest
    needs: [rustfmt, clippy, build, test, lgpl]
    steps:
      - uses: actions/checkout@v7
        with:
          # Audio fixtures live at `tests/fixtures/audio/` as a
          # submodule pointing at `findit-studio/audio-fixtures`.
          # `audio_pcm_fixtures` walks the tree and panics on
          # missing files, so tarpaulin needs them too — the
          # `test` job above already runs with submodules.
          submodules: recursive
      - name: Cache cargo build and registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-ffmpeg-full-coverage-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-ffmpeg-full-coverage-
      - uses: ./.github/actions/ffmpeg
        with:
          variant: full
      - name: Install Rust
        run: rustup update nightly && rustup default nightly
      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin
      - name: Run tarpaulin
        env:
          RUSTFLAGS: "--cfg tarpaulin"
        run: cargo tarpaulin -p mediaio-ffmpeg -p mediadecode-ffmpeg -p mediaencode-ffmpeg --all-features --run-types tests --run-types doctests --out xml
      - name: Upload to codecov.io
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ${{ github.repository }}
          fail_ci_if_error: true
          flags: ffmpeg
