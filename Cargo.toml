[workspace]
resolver = "3"
members = [
  "mediadecode",
  "mediadecode-ffmpeg",
  "mediadecode-webcodecs",
  "mediaencode",
  "mediaencode-ffmpeg",
  "mediaio",
  "mediaio-ffmpeg",
  "mediaio-timeline",
  "mediaspine",
]

[workspace.package]
edition      = "2024"
rust-version = "1.95.0"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/findit-studio/mediaio"
homepage     = "https://github.com/findit-studio/mediaio"

[workspace.dependencies]
# Workspace-internal crates — referenced by sibling members via workspace inheritance.
mediadecode = { version = "0.19", path = "mediadecode", default-features = false }
mediadecode-ffmpeg = { version = "0.19", path = "mediadecode-ffmpeg", default-features = false }
mediadecode-webcodecs = { version = "0.19", path = "mediadecode-webcodecs", default-features = false }
mediaencode = { version = "0.19", path = "mediaencode", default-features = false }
mediaencode-ffmpeg = { version = "0.19", path = "mediaencode-ffmpeg", default-features = false }
mediaio-ffmpeg = { version = "0.19", path = "mediaio-ffmpeg", default-features = false }
mediaio-timeline = { version = "0.4", path = "mediaio-timeline" }
mediaspine  = { version = "0.1", path = "mediaspine", default-features = false }
mediaframe  = { version = "0.12", default-features = false, features = ["frame"] }

# External deps used by more than one member, pinned at the workspace level.
mediatime   = { version = "0.5", default-features = false }
bitflags    = { version = "2", default-features = false }
derive_more = { version = "2", default-features = false }
thiserror   = { version = "2", default-features = false }
smol-bytes  = { version = "0.1", default-features = false, features = ["std"] }
triomphe    = { version = "0.1", default-features = false, features = ["std"] }
ffmpeg-next = { version = "9", default-features = false, features = ["codec", "format"] }
tracing     = { version = "0.1", default-features = false }
libc        = "0.2"

# Browser-only — used by `mediadecode-webcodecs`. Pinned here so the
# whole workspace agrees on a single set of bindings versions.
wasm-bindgen         = { version = "0.2", default-features = false }
wasm-bindgen-futures = { version = "0.4", default-features = false }
js-sys               = { version = "0.3", default-features = false }
web-sys              = { version = "0.3", default-features = false }
futures-channel      = { version = "0.3", default-features = false, features = ["alloc"] }

# Optional / fuzzing / serialization
serde       = { version = "1", default-features = false, features = ["derive"] }
arbitrary   = { version = "1", default-features = false }
quickcheck  = { version = "1", default-features = false }

# Generates `Send`-bounded variants of `async fn`-in-trait
# definitions; used by `mediadecode::future` to expose both
# `local::*` (`!Send`) and `send::*` (`+ Send`) trait variants
# from a single source. Proc-macro only — zero runtime cost.
trait-variant = "0.1"

# Dev / bench
criterion  = "0.8"
tempfile   = "3"
# Test-only. The optional trait matrices are proved end-to-end against a
# real self-describing format; the library itself takes no format
# dependency, so this stays a dev-dependency.
serde_json = "1"

[workspace.lints.rust]
rust_2018_idioms        = "warn"
single_use_lifetimes    = "warn"
unexpected_cfgs         = { level = "warn", check-cfg = [
  'cfg(all_tests)',
  'cfg(tarpaulin)',
  # Emitted by `mediadecode-ffmpeg/build.rs` when the FFmpeg this build
  # links was compiled with VideoToolbox — i.e. when
  # `libavutil/hwcontext_videotoolbox.h` is installed, which is what
  # decides whether `AVVTFramesContext` reaches the bindings at all.
  # `src/vtscale` compiles its VideoToolbox body only then.
  'cfg(ffmpeg_videotoolbox)',
  # Set by `.cargo/config.toml` for `wasm32-*` targets and by
  # CI's `RUSTFLAGS`. `web-sys` gates WebCodecs APIs behind it.
  'cfg(web_sys_unstable_apis)',
] }

[profile.bench]
opt-level         = 3
debug             = false
codegen-units     = 1
lto               = 'thin'
incremental       = false
debug-assertions  = false
overflow-checks   = false
rpath             = false
