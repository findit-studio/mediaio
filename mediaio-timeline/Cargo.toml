[package]
name        = "mediaio-timeline"
version     = "0.3.0"
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
documentation = "https://docs.rs/mediaio-timeline"
description = "The editing timeline as data: tracks, clips at explicit record positions, gain and fades, dissolves, markers; validation that refuses by name, a diff, and OpenTimelineIO export with its exact read-back. Pure Rust, no_std + alloc, no FFmpeg."
keywords   = ["timeline", "otio", "editing", "media", "no-std"]
categories = ["multimedia", "multimedia::video", "multimedia::audio", "no-std"]

[features]
default = ["std"]
alloc = ["serde?/alloc", "smol-bytes/alloc"]
std = ["serde?/default", "mediatime/default", "smol-bytes/default"]

serde = ["dep:serde", "mediatime/serde", "smol-bytes/serde"]

[dependencies]
derive_more = { version = "2", default-features = false, features = ["display", "is_variant", "try_unwrap", "unwrap"] }
mediatime   = { version = "0.5", default-features = false }
smol-bytes  = { version = "0.1", default-features = false }

serde     = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
