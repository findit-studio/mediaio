[package]
name        = "mediaencode-ffmpeg"
version     = "0.20.0"
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true
documentation = "https://docs.rs/mediaencode-ffmpeg"
description = "The FFmpeg write adapter of the mediaio family. In this release: the encoder-by-name catalogue, with GPL encoders reachable only behind the `gpl` feature and refused by name without it."
keywords   = ["ffmpeg", "encoder", "muxer", "mediaio"]
categories = ["multimedia", "multimedia::video", "multimedia::audio"]

[features]
default = ["std"]
std     = ["mediaencode/std", "mediaio-ffmpeg/std"]

# Lets this crate open GPL encoders (`libx264`, `libx265`, ...) by name.
# Without it they are refused by name before libavcodec is asked for
# them, so a default build never requests a GPL encoder even when the
# linked FFmpeg carries one. This feature does not decide the license of
# your binary: linking an FFmpeg built with `--enable-gpl` makes the
# binary GPL whatever this crate's features say.
gpl = []

[dependencies]
mediaencode    = { workspace = true }
mediaio-ffmpeg = { workspace = true }
ffmpeg-next    = { workspace = true }
smol-bytes     = { workspace = true }
thiserror      = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
