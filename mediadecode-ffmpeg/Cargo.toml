[package]
name        = "mediadecode-ffmpeg"
version     = "0.21.1"
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
description = "FFmpeg adapter for the `mediadecode` abstraction layer — implements its `VideoAdapter` / `AudioAdapter` / `SubtitleAdapter` traits and the matching push-style decoder traits, with hardware-acceleration auto-probe across VideoToolbox / VAAPI / NVDEC / D3D11VA and software fallback via ffmpeg-next."
repository.workspace   = true
homepage.workspace     = true
documentation = "https://docs.rs/mediadecode-ffmpeg"
keywords      = ["ffmpeg", "decoder", "video", "audio", "mediadecode"]
categories    = ["multimedia", "multimedia::video", "multimedia::audio"]

[features]
default = ["std", "resample"]
# `std` adds `mediadecode/default` (the core's `std` feature)
# on top of `mediadecode/alloc` already pinned via dep
# features below. The adapter unconditionally uses
# alloc-gated types (`mediaframe::audio::ChannelLayoutDescription`,
# `SubtitlePayload::Bitmap`, etc.) so `alloc` cannot be
# optional — pinning it via the dep features keeps
# `--no-default-features` builds compiling.
std     = ["mediadecode/default", "mediaio-ffmpeg/std"]
alloc   = []

# Gates `FfmpegResampler` (the `AudioResampler` impl over `swresample`,
# which lives in `mediaio-ffmpeg`) and, with it, the `libswresample`
# link. On by default so existing consumers see no change; a
# decode-only build that never resamples can drop it and the link
# along with it.
resample = ["mediaio-ffmpeg/resample"]

# The test machinery `mediaio-ffmpeg` gates behind its own
# `test-support` — the fault-subprocess harness, the allocation cap and
# the callback-state hooks — forwarded for crates that test through
# this one. Off by default and never needed to decode.
test-support = ["mediaio-ffmpeg/test-support"]

[dependencies]
mediadecode = { workspace = true, features = ["alloc"] }
# The base: the FFmpeg link and every crossing between FFmpeg's memory
# and the vocabulary. The machines here — the decoders and the demuxer —
# drive its carriers and conversions.
mediaio-ffmpeg = { workspace = true }
# The channel-layout vocabulary this adapter produces lives in
# `mediaframe::audio`, which is compiled only at the alloc-or-std
# tier — hence the unconditional `alloc`, the same shape as the
# `mediadecode` pin above.
mediaframe  = { workspace = true, features = ["alloc"] }
ffmpeg-next = { workspace = true }
derive_more = { workspace = true, features = ["is_variant", "try_unwrap", "unwrap"] }
smol-bytes  = { workspace = true }
triomphe    = { workspace = true }
thiserror   = { workspace = true }
tracing     = { workspace = true }
libc        = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
# This crate's unit lanes drive the base's test machinery: the fault
# subprocess, the allocation cap and the callback-state hooks.
mediaio-ffmpeg = { workspace = true, features = ["test-support"] }
# The demux and resample lanes generate their own media (multi-track
# containers, cover art, sine WAVs) with the `ffmpeg` CLI at run time —
# see `tests/support/mod.rs`. This is where it goes.
tempfile  = { workspace = true }
# The write faces, for `tests/generic_remux.rs`: a remux written against
# `Demuxer` and `Muxer` alone, run over this crate's demuxer.
mediaencode = { workspace = true, features = ["std"] }

[[example]]
name = "decode"
path = "examples/decode.rs"

[[example]]
name = "decode_via_trait"
path = "examples/decode_via_trait.rs"

[[bench]]
name = "decode"
path = "benches/decode.rs"
harness = false

[[test]]
name = "resample"
path = "tests/resample.rs"
# Skip the binary entirely without `resample` rather than compiling
# it down to nothing — `FfmpegResampler` is the only thing it exercises.
required-features = ["resample"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
